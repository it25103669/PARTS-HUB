# ============================================================
# PartsHub Pro – Application Configuration
# ============================================================

# --- Server ---
server.port=8080

# --- DataSource (MySQL) ---
# Set DB_USERNAME / DB_PASSWORD as environment variables, or leave defaults below.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/PartsHub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- SQL Script Initialization ---
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- Application ---
spring.application.name=PartsHub Pro
