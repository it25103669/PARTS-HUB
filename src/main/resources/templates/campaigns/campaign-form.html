<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Campaign Form - PartsHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --border-subtle: #334155;
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
            --primary: #38BDF8;
            --danger: #EF4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }
        .header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 24px;
            max-width: 650px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-dim);
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #0F172A;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--primary);
            color: #0F172A;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
        .btn-secondary {
            background-color: var(--border-subtle);
            color: var(--text-main);
            text-decoration: none;
            display: inline-block;
            margin-left: 8px;
        }
        .error {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${pageTitle}">Create Promotional Campaign</h1>
    </div>

    <div class="card">
        <form th:action="${formMode == 'edit'} ? @{'/campaigns/' + ${campaignForm.campaignId} + '/edit'} : @{/campaigns/create}"
              th:object="${campaignForm}" method="post">

            <div class="form-group">
                <label>Campaign Name *</label>
                <input type="text" th:field="*{campaignName}" placeholder="e.g. Q3 AI & Gaming Festival" required />
                <div class="error" th:if="${#fields.hasErrors('campaignName')}" th:errors="*{campaignName}"></div>
            </div>

            <div class="form-group">
                <label>Selected Products / Categories *</label>
                <input type="text" th:field="*{selectedProducts}" placeholder="e.g. Intel Core i9, ASUS ROG Strix RTX 4080" required />
                <div class="error" th:if="${#fields.hasErrors('selectedProducts')}" th:errors="*{selectedProducts}"></div>
            </div>

            <div class="form-group">
                <label>Discount Percentage (%) *</label>
                <input type="number" step="0.01" th:field="*{discountPercentage}" placeholder="e.g. 15.00" required />
                <div class="error" th:if="${#fields.hasErrors('discountPercentage')}" th:errors="*{discountPercentage}"></div>
            </div>

            <div class="form-group">
                <label>Start Date *</label>
                <input type="date" th:field="*{startDate}" required />
                <div class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
            </div>

            <div class="form-group">
                <label>End Date *</label>
                <input type="date" th:field="*{endDate}" required />
                <div class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" rows="3" placeholder="Optional campaign details..."></textarea>
            </div>

            <div>
                <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Save Campaign</button>
                <a href="/campaigns" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
